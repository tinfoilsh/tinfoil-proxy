name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  updater:
    name: Updater regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Exercise updater lifecycle
        run: npm run test:updater

  test:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install kubeconform
        env:
          # GitHub computes and serves this asset digest for kubeconform v0.8.0.
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tgz
          echo "$KUBECONFORM_SHA256  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint, render, and validate
        run: |
          set -euo pipefail
          CHART=deploy/helm/tinfoil-proxy
          helm lint "$CHART"
          helm template tinfoil-proxy "$CHART" > /tmp/default.yaml
          helm template tinfoil-proxy "$CHART" \
            --set healthcheck.type=http \
            --set proxy.userCacheSecret.existingSecret=cache-secret \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.egress.tinfoilCIDRs={203.0.113.10/32}' \
            --set-json 'networkPolicy.ingress.allowedIngressFrom=[{"namespace":"gateway"}]' \
            --set-json 'networkPolicy.egress.extraEgress=[{"to":[{"ipBlock":{"cidr":"198.51.100.0/24"}}],"ports":[{"protocol":"TCP","port":443}]}]' > /tmp/restricted.yaml
          helm template tinfoil-proxy "$CHART" \
            --set networkPolicy.enabled=true \
            --set networkPolicy.egress.useFQDNEgress=true > /tmp/cilium.yaml
          # The Cilium policy is a custom resource with no bundled schema.
          kubeconform -strict -summary -kubernetes-version 1.31.0 -skip CiliumNetworkPolicy \
            /tmp/default.yaml /tmp/restricted.yaml /tmp/cilium.yaml

      - name: Refuse unsafe network policies
        run: |
          set -euo pipefail
          CHART=deploy/helm/tinfoil-proxy
          # An enabled policy with no egress destinations must not render.
          if helm template tinfoil-proxy "$CHART" --set networkPolicy.enabled=true > /dev/null 2>&1; then
            exit 1
          fi
          # An ingress source with no selector would allow every client.
          if helm template tinfoil-proxy "$CHART" \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.egress.tinfoilCIDRs={203.0.113.10/32}' \
            --set-json 'networkPolicy.ingress.allowedIngressFrom=[{}]' > /dev/null 2>&1; then
            exit 1
          fi

  go:
    name: Go tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go vet . && go test -race .
