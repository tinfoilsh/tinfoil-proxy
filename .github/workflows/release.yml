name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish CLI assets for
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify_release:
    name: Verify release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'

      - name: Verify tag and version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          VERSION="$(node -p "require('./app/package.json').version")"
          test "v${VERSION}" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  build:
    name: Build & publish (${{ matrix.os }})
    needs: verify_release
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package_script: package:mac
          - os: ubuntu-latest
            package_script: package:linux
          - os: windows-latest
            package_script: package:win
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Package & publish (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.package_script }} -- --publish always

      - name: Package & publish (Linux/Windows)
        if: ${{ !startsWith(matrix.os, 'macos') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.package_script }} -- --publish always

  cli-binaries:
    name: Build standalone CLI
    needs:
      - verify_release
      - build
    if: ${{ always() && needs.verify_release.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build, sign, and notarize binaries
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PASSWORD_BYTES=32
          KEYCHAIN_TIMEOUT_SECONDS=600
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/cli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 "$KEYCHAIN_PASSWORD_BYTES")"
          NOTARIZATION_DIR="${RUNNER_TEMP}/cli-notarization"
          NOTARIZATION_ARCHIVE="${RUNNER_TEMP}/cli-notarization.zip"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf "$CERTIFICATE_PATH" "$NOTARIZATION_DIR" "$NOTARIZATION_ARCHIVE"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut "$KEYCHAIN_TIMEOUT_SECONDS" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              sed -nE 's/^[[:space:]]*[0-9]+\) ([0-9A-F]+) "Developer ID Application:.*$/\1/p' |
              sed -n '1p'
          )"
          test -n "$SIGNING_IDENTITY"

          mkdir -p release-bin
          for target in \
              "darwin amd64 tinfoil-proxy-darwin-amd64" \
              "darwin arm64 tinfoil-proxy-darwin-arm64" \
              "linux amd64 tinfoil-proxy-linux-amd64" \
              "linux arm64 tinfoil-proxy-linux-arm64" \
              "windows amd64 tinfoil-proxy-windows-amd64.exe"; do
            read -r goos goarch output_name <<< "$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.buildVersion=${RELEASE_TAG}" -o "release-bin/$output_name" .
          done

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          for binary in release-bin/tinfoil-proxy-darwin-*; do
            codesign \
              --force \
              --keychain "$KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              --sign "$SIGNING_IDENTITY" \
              "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          security lock-keychain "$KEYCHAIN_PATH"

          mkdir -p "$NOTARIZATION_DIR"
          cp release-bin/tinfoil-proxy-darwin-* "$NOTARIZATION_DIR/"
          ditto -c -k --keepParent "$NOTARIZATION_DIR" "$NOTARIZATION_ARCHIVE"
          xcrun notarytool submit "$NOTARIZATION_ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          for binary in release-bin/tinfoil-proxy-darwin-*; do
            codesign --verify --strict --check-notarization --verbose=2 "$binary"
          done

          ls -la release-bin

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-bin
          shasum -a 256 tinfoil-proxy-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$RECOVERY_MODE" = "true" ]; then
              echo "Release $TAG does not exist; recovery runs cannot create releases."
              exit 1
            fi
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

          EXISTING_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in release-bin/*; do
            asset_name="${asset##*/}"
            while IFS= read -r existing_asset; do
              if [ "$asset_name" = "$existing_asset" ]; then
                echo "Release asset already exists: $asset_name"
                exit 1
              fi
            done <<< "$EXISTING_ASSETS"
          done

          gh release upload "$TAG" release-bin/*

  docker:
    name: Build & push Docker image
    needs:
      - verify_release
      - build
    if: ${{ github.event_name == 'push' && needs.verify_release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/tinfoil-proxy"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${TAG}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push .
