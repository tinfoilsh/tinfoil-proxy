name: Build unpublished updater test app

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch in this repository containing the updater to test
        required: true
        default: main
        type: string
      test_version:
        description: Temporary stable app version lower than the published update target
        required: true
        default: '0.2.7'
        type: string
      platform:
        description: Platform on which the native update will be tested
        required: true
        default: macos
        type: choice
        options: [macos, windows, linux]

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      - name: Resolve a repository branch to an immutable commit
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          set -euo pipefail
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.TEST_VERSION)) throw Error("test_version must be a stable X.Y.Z version")'
          BRANCH_COMPONENT="$(node -p 'encodeURIComponent(process.env.SOURCE_BRANCH)')"
          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH_COMPONENT}" --jq '.commit.sha')"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build test app (${{ inputs.platform }})
    needs: resolve
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Validate selected source
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          # Older baseline branches do not have this suite. The build record
          # records whether it was present, rather than treating it as a pass.
          npm run test:updater --if-present

      - name: Set temporary version without tagging
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: npm version "$TEST_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: Package signed and notarized macOS test app
        if: inputs.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac -- --publish never

      - name: Package Windows test app
        if: inputs.platform == 'windows'
        run: npm run package:win -- --publish never

      - name: Package Linux test app
        if: inputs.platform == 'linux'
        run: npm run package:linux -- --publish never

      - name: Record source and artifact digests
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TEST_PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const artifacts = readdirSync('dist').filter(name => /\.(pkg|dmg|zip|exe|deb)$/.test(name)).map(name => ({
            name,
            sha256: createHash('sha256').update(readFileSync(`dist/${name}`)).digest('hex')
          }))
          if (artifacts.length === 0) throw new Error('No desktop installers produced')
          const record = {
            sourceCommit: process.env.SOURCE_SHA,
            testVersion: pkg.version,
            platform: process.env.TEST_PLATFORM,
            updaterRegressionSuitePresent: Boolean(pkg.scripts?.['test:updater']),
            published: false,
            artifacts
          }
          writeFileSync('dist/updater-test-build.json', JSON.stringify(record, null, 2) + '\n')
          JS

      - name: Upload test installers and build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-test-${{ inputs.platform }}-${{ github.run_id }}
          path: |
            app/dist/*.pkg
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.deb
            app/dist/updater-test-build.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
